<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1446">
<title>Psychological Question</title>
<style>
:root{
  --text:#fff;
  --muted:rgba(255,255,255,.72);
  --ease:cubic-bezier(.22,.8,.24,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:"Noto Sans Thai","Sarabun",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--text);
  background:#150f3a;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---------- Background (transform-only animation, no blur filters) ---------- */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;
  background:linear-gradient(160deg,#1b1446 0%,#2a1b6b 45%,#0f3a6b 100%)}
.blob{position:absolute;border-radius:50%;will-change:transform;
  width:70vmax;height:70vmax;opacity:.75}
.b1{left:-25vmax;top:-20vmax;background:radial-gradient(circle,rgba(255,92,170,.65),rgba(255,92,170,0) 65%);animation:f1 26s ease-in-out infinite alternate}
.b2{right:-30vmax;top:10vmax;background:radial-gradient(circle,rgba(70,190,255,.6),rgba(70,190,255,0) 65%);animation:f2 32s ease-in-out infinite alternate}
.b3{left:5vmax;bottom:-35vmax;background:radial-gradient(circle,rgba(150,110,255,.65),rgba(150,110,255,0) 65%);animation:f3 28s ease-in-out infinite alternate}
@keyframes f1{to{transform:translate3d(18vmax,12vmax,0) scale(1.1)}}
@keyframes f2{to{transform:translate3d(-16vmax,10vmax,0) scale(1.15)}}
@keyframes f3{to{transform:translate3d(14vmax,-12vmax,0) scale(1.05)}}

/* ---------- Layout ---------- */
.app{position:relative;z-index:1;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:72px 16px 32px}
#screen{width:100%;max-width:560px}

/* ---------- Liquid glass ---------- */
.glass{
  position:relative;border-radius:28px;
  background:linear-gradient(135deg,rgba(255,255,255,.24),rgba(255,255,255,.07));
  -webkit-backdrop-filter:blur(16px) saturate(160%);
  backdrop-filter:blur(16px) saturate(160%);
  border:1px solid rgba(255,255,255,.34);
  box-shadow:0 10px 34px rgba(5,0,40,.35),
    inset 0 1px 0 rgba(255,255,255,.55),
    inset 0 -1px 0 rgba(255,255,255,.12);
}
.glass::before{ /* specular highlight */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 38%);
  opacity:.55;
}
.card{padding:28px 22px;text-align:center}
@media(min-width:520px){.card{padding:36px 34px}}

/* ---------- Screen enter ---------- */
.enter{animation:enter .55s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translate3d(0,18px,0) scale(.98)}to{opacity:1;transform:none}}
.leave{animation:leave .25s ease-in both}
@keyframes leave{to{opacity:0;transform:translate3d(0,-10px,0) scale(.98)}}

/* ---------- Typography ---------- */
h1{margin:14px 0 4px;font-size:clamp(24px,6vw,32px);font-weight:700;letter-spacing:.2px}
h2{margin:0 0 6px;font-size:clamp(19px,4.8vw,23px);line-height:1.45;font-weight:600}
.sub{margin:0 0 22px;color:var(--muted);font-size:14px}
.small{font-size:12.5px;color:var(--muted)}

/* ---------- Buttons ---------- */
.btn{
  position:relative;display:block;width:100%;cursor:pointer;
  font:inherit;color:#fff;text-align:center;
  padding:14px 18px;border-radius:18px;
  background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.1));
  border:1px solid rgba(255,255,255,.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 14px rgba(5,0,40,.25);
  transition:transform .18s var(--ease),background .25s,box-shadow .25s;
  will-change:transform;
  -webkit-user-select:none;user-select:none;
}
.btn:active{transform:scale(.95)}
@media(hover:hover){.btn:hover{background:linear-gradient(135deg,rgba(255,255,255,.38),rgba(255,255,255,.14));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 8px 22px rgba(5,0,40,.3)}}
.btn.primary{background:linear-gradient(135deg,rgba(255,120,200,.65),rgba(110,140,255,.6));font-weight:600}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ---------- Language switch ---------- */
.seg{position:fixed;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:5;
  display:flex;padding:3px;border-radius:999px}
.seg button{font:inherit;font-size:12px;font-weight:600;color:var(--muted);background:transparent;border:0;
  padding:6px 11px;border-radius:999px;cursor:pointer;transition:background .25s,color .25s,transform .15s}
.seg button:active{transform:scale(.9)}
.seg button.on{color:#fff;background:rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}

/* ---------- Intro ---------- */
.iconwrap{display:flex;flex-direction:column;align-items:center;transition:transform 1.4s var(--ease);will-change:transform}
.iconwrap.moved{transform:translate3d(clamp(-70px,-14vw,-30px),0,0)}
.icon{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;cursor:pointer;border:0;padding:0;color:#fff;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.55),rgba(255,255,255,.12) 60%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 10px 28px rgba(5,0,40,.4);
  animation:bob 4.5s ease-in-out infinite;transition:transform .2s var(--ease)}
.icon:active{transform:scale(.9)}
@keyframes bob{50%{transform:translate3d(0,-6px,0)}}
.icon svg{width:50px;height:50px}
.secret{max-width:230px;margin-top:12px;font-size:13.5px;color:var(--muted);opacity:0;transform:translate3d(0,-6px,0);
  transition:opacity .9s .5s,transform .9s .5s var(--ease);min-height:0;height:0;overflow:visible}
.iconwrap.moved .secret{opacity:1;transform:none;height:auto;min-height:40px}
.credit{margin:6px 0 20px;font-size:13.5px;color:var(--muted)}
.credit b{color:#fff;font-weight:600}
input.name{
  width:100%;font:inherit;font-size:16px;color:#fff;text-align:center;
  padding:14px 16px;margin-bottom:14px;border-radius:18px;outline:none;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.38);
  box-shadow:inset 0 2px 8px rgba(5,0,40,.22);transition:background .25s,border-color .25s,box-shadow .25s}
input.name::placeholder{color:rgba(255,255,255,.55)}
input.name:focus{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.7)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.stack{display:grid;gap:12px}

/* ---------- Quiz ---------- */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;width:100%;border-radius:inherit;transform-origin:left;will-change:transform;
  background:linear-gradient(90deg,#ff7cc8,#7aa2ff);transition:transform .6s var(--ease)}
.qtext{text-align:left}
.qtext .sit{margin:0 0 4px}
.qtext .ask{color:#ffd9f0;font-weight:500}
.hint{min-height:20px;margin:10px 0 8px;text-align:center;font-size:12.5px;color:#ffd9f0;opacity:0;transform:translate3d(0,4px,0);transition:opacity .25s,transform .25s}
.hint.show{opacity:1;transform:none}
.opts{display:grid;gap:11px}
.opt{text-align:left;padding:15px 16px;line-height:1.45;transition:transform .45s var(--ease),background .25s,box-shadow .25s}
.opt.chosen{background:linear-gradient(135deg,rgba(255,120,200,.7),rgba(110,140,255,.65));animation:pop .35s var(--ease)}
@keyframes pop{50%{transform:scale(1.04)}}
.opts.lock .opt:not(.chosen){opacity:.55;transition:opacity .3s}

/* ---------- Result ---------- */
.badge{display:inline-block;padding:5px 14px;border-radius:99px;font-size:12.5px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);margin-bottom:10px}
.emoji{font-size:54px;line-height:1;margin:2px 0 6px;animation:bob 4.5s ease-in-out infinite}
.desc{margin:10px 0 18px;line-height:1.7;color:rgba(255,255,255,.9);font-size:15px}
.meters{display:grid;gap:9px;margin:0 0 18px;text-align:left}
.meter{display:grid;grid-template-columns:96px 1fr 38px;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.meter .tr{height:8px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
.meter .tr i{display:block;height:100%;width:100%;border-radius:inherit;transform-origin:left;transform:scaleX(0);will-change:transform;
  background:linear-gradient(90deg,#ff7cc8,#7aa2ff);transition:transform 1s .25s var(--ease)}
.privacy{margin:0 0 16px;font-size:12.5px;color:var(--muted)}

/* ---------- Tap ripples (pooled) ---------- */
.rip{position:fixed;left:0;top:0;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;pointer-events:none;z-index:9;opacity:0;
  background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,.12) 55%,rgba(255,255,255,0) 70%);will-change:transform,opacity}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<div class="seg glass" id="seg" role="group" aria-label="Language">
  <button data-l="th" type="button">TH</button><button data-l="en" type="button">EN</button>
</div>

<main class="app"><div id="screen"></div></main>

<script>
(function(){
"use strict";

/* =================== DATA =================== */
// 50 situations x 10 framings = 500 unique questions. Styles: A=Analyst, I=Intuitive, S=Connector, B=Adventurer
const SIT=[
["ได้ข้อเสนองานใหม่ เงินเดือนสูงกว่าแต่ต้องย้ายเมือง","You got a higher-paying job offer, but it means moving cities."],
